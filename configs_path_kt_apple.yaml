##################################################
# Full Path-aware KT experiment config for Apple Silicon (M4 Pro)
# Optimized for MPS backend with float16
##################################################

seed: 0
exp_name: 'path_aware_kt_apple'
save_model: true
testing: false
log_train_every_itr: 10
model_save_dir: 'checkpoints'
use_cuda: false    # <-- disabled for Apple Silicon
use_mps: true      # <-- Apple Silicon Metal
log_wandb: false
continue_training: false
start_epoch: 0
wandb_project: 'path_aware_kt'
wandb_key: ''
multitask: true
kc_loss: true

# data_opts
data_path: 'data'
test_size: 0.2
max_len: 20
label_type: 'binary'
first_ast_convertible: true
split_by: 'student'

# model_lstm_opts
use_lstm: true
lstm_inp_dim: 4296
train_lstm: true
num_layers: 1
lstm_lr: 0.0005
baseline: false
transition: false

# LLM — use smaller LoRA for memory efficiency on 18GB
okt_model: 'meta-llama/Meta-Llama-3-8B-Instruct'
train_okt: true

# Training — tuned for 24GB M4 Pro
epochs: 5
batch_size: 1       # <-- Llama-3-8B float16 uses ~16GB, leave room for activations
accum_iter: 2       # <-- effective batch = 2
lr: 0.00001
trans_linear_lr: 0.0001
pred_linear_lr: 0.0001
binary_loss_fn: 'BCE'
use_scheduler: true
warmup_ratio: 0.1
alpha: 0.8
kc_loss_method: 'prod'

# LoRA — balanced for 24GB (model ~16GB + LoRA ~2GB + activations ~4GB)
lora_alpha: 192     # <-- slightly below full 256
lora_dropout: 0.05
lora_r: 96          # <-- sweet spot for 24GB

# evaluation
nsamples: 1
k: 1
p: 0
max_new_tokens: 400
change_generation_length: false

# PATH-AWARE OPTIONS
path_mode: 'hard'
path_dir: 'path_cache'
n_paths: 3
randomize_paths: false
kc_path: 'problem_kc.json'
predictor_multilayer: false
temperature: 1.0
